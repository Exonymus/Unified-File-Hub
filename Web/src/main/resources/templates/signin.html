<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
                      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="theme-color" content="#712cf9">

  <title>DesuRep - Login</title>
  <link rel="stylesheet" href="/css/signin.css" type="text/css"/>
  <link rel="stylesheet" href="/css/tools/floating_input.css" type="text/css"/>
  <link rel="stylesheet" href="/css/tools/preloader.css" type="text/css"/>

  <link type="image/png" href="/img/favicon.png" rel="shortcut icon">
  <link type="Image/png" href="/img/favicon.png" rel="icon">
</head>

<body>
  <main>
    <script src="/js/views/preloader_view.js"></script>
    <div id="loader_wrapper">
      <div id="loader"></div>
      <div class="loader_section section_left"></div>
      <div class="loader_section section_right"></div>
    </div>

    <div class="center">
      <div class="inner_img"><img src="/img/mainico.svg" alt="no loli?("></div>
      <h1 id="siteName">DesuRep</h1>
      <form th:action="@{/signin}" method="post">
        <div class="txt_field">
          <input type="text" name="username" id="floating_input" required>
          <span></span>
          <label for="floating_input">Username</label>
        </div>
        <div class="txt_field">
          <input type="password" name="password" id="floating_password" required>
          <span></span>
          <label for="floating_password">Password</label>
        </div>
        <!--<div class="pass">Forgot password? (ㆆ 、ㆆ)</div>-->
        <div class="error" th:if="${param.error}">
          Incorrect username or password
        </div>
        <input type="hidden" name="_csrf" value="{{_csrf.token}}">
        <button type="submit">Login</button>
        <div class="signup_link">
          Not a member, desu? Tab here (｀ᴗ´)っ <a href="/signup">SignUp</a>
        </div>
        <div class="signup_link">
          Or take a look at our <a href="/public">Public ☜(˚▽˚)☞ files</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
